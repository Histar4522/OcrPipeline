[project]
name = "ocr-pipeline"
version = "0.2.0"
description = "Free, local, Ollama-powered AI OCR desktop app and pipeline for PDFs and image series."
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [{ name = "Weien Xu" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "notify-py>=0.3.43",
    "pillow>=10.0.0",
    "platformdirs>=4.3.0",
    "pymupdf>=1.24.0",
    "pystray>=0.19.5",
    "python-multipart>=0.0.12",
    "pywebview>=5.3.0",
    "rich>=13.7.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
ocr-pipeline = "ocr_pipeline.cli:main"

[project.gui-scripts]
ocr-pipeline-app = "ocr_pipeline.desktop:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
