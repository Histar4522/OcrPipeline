name: Build macOS Installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub release tag to upload the .dmg to (e.g. v0.2.2)"
        required: false
        default: ""
      release_build:
        description: "Build clean release version x.x.x (unchecked builds dev-<commit>-<ts>)"
        type: boolean
        required: false
        default: true

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11 & dependencies
        run: uv sync --frozen --python 3.11

      - name: Run unit tests
        run: uv run --no-sync pytest -v

      - name: Build macOS .app and .dmg
        run: |
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.release_build }}" = "true" ]; then
            uv run --no-sync python installer/build_installer.py --release
          else
            uv run --no-sync python installer/build_installer.py
          fi
          ./dist/OcrPipeline.app/Contents/MacOS/OcrPipeline --help

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OcrPipeline-macOS-dmg
          path: dist/*.dmg

      - name: Attach .dmg to GitHub Release
        if: ${{ github.event.release.tag_name || inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          gh release upload "$TAG" dist/*.dmg --clobber
